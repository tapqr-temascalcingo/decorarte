<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decorarte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fdf3f6;
    color: #3a2c30;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* ---------- SPLASH SCREEN ---------- */
  #splash {
    position: fixed;
    inset: 0;
    background: #fdf3f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: splashOut 0.6s ease forwards;
    animation-delay: 2.0s;
  }
  #splash img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.6);
    animation: logoIn 0.7s ease forwards;
    box-shadow: 0 4px 24px rgba(214,150,170,0.35);
  }
  #splash p {
    margin-top: 16px;
    font-size: 17px;
    font-weight: 600;
    color: #b8860b;
    letter-spacing: 0.5px;
    opacity: 0;
    animation: textIn 0.6s ease forwards;
    animation-delay: 0.5s;
  }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }
  @keyframes textIn { to { opacity: 1; } }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }

  /* ---------- CONTENIDO PRINCIPAL ---------- */
  .card {
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 18px;
    box-shadow: 0 4px 20px rgba(214,150,170,0.3);
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-bottom: 6px;
    color: #3a2c30;
  }
  p.subtitle {
    color: #a98d95;
    font-size: 13px;
    margin-bottom: 26px;
    letter-spacing: 0.2px;
  }
  .btn {
    display: block;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 15px;
    border-radius: 30px;
    margin-bottom: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    opacity: 0;
    transform: translateY(14px);
    animation: btnIn 0.5s ease forwards;
    border: 1px solid transparent;
  }
  .btn:active { transform: scale(0.97); }

  .btn-instagram {
    background: linear-gradient(135deg, #fbe4ec, #f6c9d8);
    color: #8a4a5c;
    border: 1px solid #e8b6c6;
    animation-delay: 2.2s;
  }
  .btn-google {
    background: #ffffff;
    color: #b8860b;
    border: 1px solid #e9cf9a;
    animation-delay: 2.4s;
  }
  .btn-whatsapp {
    background: #ffffff;
    color: #6c9a6f;
    border: 1px solid #cfe3cf;
    animation-delay: 2.6s;
  }
  .btn-facebook {
    background: #ffffff;
    color: #5b7ea8;
    border: 1px solid #cbd9e8;
    animation-delay: 2.8s;
  }

  footer {
    margin-top: 20px;
    font-size: 11px;
    color: #c2a6ae;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: btnIn 0.5s ease forwards;
    animation-delay: 3.0s;
  }

  @keyframes btnIn { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

  <!-- Pantalla de bienvenida -->
  <div id="splash">
    <img src="logo.png" alt="Decorarte">
    <p>Bienvenido a Decorarte</p>
  </div>

  <!-- Contenido principal -->
  <div class="card">
    <img src="logo.png" alt="Decorarte" class="logo">
    <h1>Decorarte</h1>
    <p class="subtitle">¡Gracias por tu visita! Elige una opción:</p>

    <a class="btn btn-instagram" href="https://www.instagram.com/decorartetemas?stkn=MXkxcTIya3ZkOXV0Zw==" target="_blank">
      📸 Síguenos en Instagram
    </a>

    <a class="btn btn-google" href="https://search.google.com/local/writereview?placeid=ChIJVQZ5CMX70oURISEiY5jII1g" target="_blank">
      ⭐ Déjanos una reseña en Google
    </a>

    <a class="btn btn-whatsapp" href="https://wa.me/527122319080" target="_blank">
      💬 Escríbenos por WhatsApp
    </a>

    <a class="btn btn-facebook" href="https://www.facebook.com/profile.php?id=100064143365816" target="_blank">
      👍 Síguenos en Facebook
    </a>

    <footer>Decorarte · Temascalcingo</footer>
  </div>
</body>
</html>
