<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decorarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(160deg, #fffaf9 0%, #fdf1f4 55%, #faeaee 100%);
    color: #4a3a40;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px 20px;
    overflow-x: hidden;
    position: relative;
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.28; z-index: 0; animation: float 15s ease-in-out infinite; }
  .blob1 { width: 240px; height: 240px; background: #f6c9d8; top: -70px; left: -60px; }
  .blob2 { width: 200px; height: 200px; background: #e9cf9a; bottom: -60px; right: -50px; animation-delay: 5s; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(16px,-18px) scale(1.06); } }

  .confetti { position: fixed; top: -20px; border-radius: 50%; opacity: 0.8; z-index: 90; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

  /* ================= SPLASH ================= */
  #splash {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #fffaf9 0%, #fdf1f4 55%, #faeaee 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; animation: splashOut 0.45s ease forwards; animation-delay: 2.1s;
  }
  .stage { position: relative; width: 190px; height: 190px; }
  .box { position: absolute; left: 25px; top: 70px; width: 140px; height: 95px; background: linear-gradient(160deg, #f6cede, #f0aecb); border-radius: 10px; box-shadow: 0 10px 22px rgba(214,150,170,0.3); opacity: 0; animation: boxIn 0.35s ease forwards, boxOut 0.4s ease forwards; animation-delay: 0s, 1.24s; }
  @keyframes boxIn { to { opacity: 1; } }
  @keyframes boxOut { to { opacity: 0; transform: scale(0.85); } }
  .lid { position: absolute; left: 25px; top: 58px; width: 140px; height: 30px; background: linear-gradient(160deg, #f8d9e6, #f3bdd6); border-radius: 8px; opacity: 0; animation: boxIn 0.35s ease forwards, boxOut 0.4s ease forwards; animation-delay: 0s, 1.1s; z-index: 5; }
  .ribbon-v { position: absolute; left: 88px; top: 55px; width: 14px; height: 112px; background: linear-gradient(180deg, #e9cf9a, #d4af37, #e9cf9a); border-radius: 3px; opacity: 0; animation: ribbonIn 0.28s ease forwards, ribbonVOut 0.4s cubic-bezier(.4,0,.2,1) forwards; animation-delay: 0.12s, 0.84s; z-index: 4; }
  .ribbon-h { position: absolute; left: 25px; top: 108px; width: 140px; height: 14px; background: linear-gradient(90deg, #e9cf9a, #d4af37, #e9cf9a); border-radius: 3px; opacity: 0; animation: ribbonIn 0.28s ease forwards, ribbonHOut 0.4s cubic-bezier(.4,0,.2,1) forwards; animation-delay: 0.12s, 0.84s; z-index: 4; }
  @keyframes ribbonIn { to { opacity: 1; } }
  @keyframes ribbonVOut { to { transform: translateY(-70px) rotate(-8deg); opacity: 0; } }
  @keyframes ribbonHOut { to { transform: translateX(70px) rotate(8deg); opacity: 0; } }
  .knot { position: absolute; left: 95px; top: 47px; width: 16px; height: 16px; border-radius: 50%; background: #d4af37; z-index: 6; opacity: 0; animation: knotIn 0.2s ease forwards, knotOut 0.25s ease forwards; animation-delay: 0.4s, 0.64s; }
  @keyframes knotIn { to { opacity: 1; } }
  @keyframes knotOut { to { transform: scale(0); opacity: 0; } }
  .loop { position: absolute; top: 40px; width: 34px; height: 24px; z-index: 6; opacity: 0; }
  @keyframes loopIn { to { opacity: 1; } }
  .loop-left { left: 62px; background: radial-gradient(ellipse at 70% 50%, #f3c2d4, #e89bb8); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform-origin: right center; animation-name: loopIn, loopOutLeft; animation-duration: 0.2s, 0.35s; animation-fill-mode: forwards; animation-timing-function: ease, cubic-bezier(.4,0,.2,1); animation-delay: 0.34s, 0.64s; }
  .loop-right { left: 96px; background: radial-gradient(ellipse at 30% 50%, #f3c2d4, #e89bb8); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform-origin: left center; animation-name: loopIn, loopOutRight; animation-duration: 0.2s, 0.35s; animation-fill-mode: forwards; animation-timing-function: ease, cubic-bezier(.4,0,.2,1); animation-delay: 0.34s, 0.64s; }
  @keyframes loopOutLeft { to { transform: translate(-45px,-30px) rotate(-70deg) scale(0.5); opacity: 0; } }
  @keyframes loopOutRight { to { transform: translate(45px,-30px) rotate(70deg) scale(0.5); opacity: 0; } }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }

  /* ================= CONTENIDO PRINCIPAL ================= */
  .card { max-width: 400px; width: 100%; text-align: center; position: relative; z-index: 1; opacity: 0; animation: cardIn 0.6s ease forwards; animation-delay: 2.1s; }
  @keyframes cardIn { to { opacity: 1; } }
  @keyframes logoPop { to { opacity: 1; transform: scale(1); } }

  /* Divisor: linea - corazon - linea */
  .divider { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0; opacity: 0; animation: cardIn 0.5s ease forwards; }
  .divider .line { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, #d4af37, transparent); }
  .divider .heart { color: #f5c6d6; font-size: 14px; text-shadow: 0 0 6px rgba(245, 198, 214, 0.7); }
  .d2 { animation-delay: 2.5s; }
  .d3 { animation-delay: 3.1s; }
  .d4 { animation-delay: 3.9s; }

  /* Logo principal (sin marco) */
  .brand-logo {
    display: block;
    max-width: 220px;
    width: 100%;
    height: auto;
    margin: 10px auto 0;
    opacity: 0;
    transform: scale(0.9);
    animation: logoPop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: 2.2s;
  }

  .headline {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 27px;
    color: #6b4a52;
    margin-bottom: 6px;
    opacity: 0;
    animation: cardIn 0.5s ease forwards;
    animation-delay: 2.9s;
  }
  .desc {
    font-size: 12.5px;
    color: #a98d95;
    line-height: 1.5;
    max-width: 300px;
    margin: 0 auto;
    opacity: 0;
    animation: cardIn 0.5s ease forwards;
    animation-delay: 3.0s;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 14px; margin-top: 6px; }

  .btn {
    position: relative; text-decoration: none; display: block;
    padding: 38px 8px 15px;
    border-radius: 40px;
    border: 1.4px solid #cda54a;
    background: rgba(252,231,238,0.55);
    opacity: 0; transform: translateY(14px);
    animation: btnIn 0.5s ease forwards;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  @keyframes btnIn { to { opacity: 1; transform: translateY(0); } }
  .btn-instagram { animation-delay: 4.05s; }
  .btn-google     { animation-delay: 4.2s; }
  .btn-whatsapp   { animation-delay: 4.35s; }
  .btn-facebook   { animation-delay: 4.5s; }

  .icon-circle {
    position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ec9dbb, #dc6fa0);
    border: 2px solid #cda54a;
    box-shadow: 0 4px 12px rgba(214,150,170,0.35), 0 0 0 4px #fdf1f4;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-circle.white-bg { background: radial-gradient(circle at 35% 30%, #ffffff, #fdf1f4); }
  .icon-circle svg { width: 22px; height: 22px; }

  .btn-title { display: block; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 14px; color: #4a3a40; margin-bottom: 3px; }
  .btn-arrow { display: block; color: #b8860b; font-size: 13px; }

  footer.tag {
    margin-top: 4px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 19px;
    color: #6b4a52;
    opacity: 0;
    animation: cardIn 0.5s ease forwards;
    animation-delay: 4.7s;
  }
  .loc {
    margin-top: 6px;
    font-size: 9.5px;
    letter-spacing: 1.2px;
    color: #c2a6ae;
    opacity: 0;
    animation: cardIn 0.5s ease forwards;
    animation-delay: 4.8s;
  }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div id="splash">
    <div class="stage">
      <div class="box"></div>
      <div class="ribbon-v"></div>
      <div class="ribbon-h"></div>
      <div class="loop loop-left"></div>
      <div class="loop loop-right"></div>
      <div class="knot"></div>
      <div class="lid"></div>
    </div>
  </div>

  <div class="card">

    <img src="logo.png" alt="Decorarte" class="brand-logo">

    <div class="divider d2"><span class="line"></span><span class="heart">&#10084;</span><span class="line"></span></div>

    <p class="headline">&iexcl;S&iacute;guenos en nuestras redes!</p>
    <p class="desc">Encuentra m&aacute;s inspiraci&oacute;n, novedades y mant&eacute;nte en contacto con nosotros.</p>

    <div class="divider d3"><span class="line"></span><span class="heart">&#10084;</span><span class="line"></span></div>

    <div class="grid">
      <a class="btn btn-instagram" href="https://www.instagram.com/decorartetemas?stkn=MXkxcTIya3ZkOXV0Zw==" target="_blank">
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="#ffffff" stroke="none"/></svg>
        </span>
        <span class="btn-title">Instagram</span>
        <span class="btn-arrow">&#8594;</span>
      </a>

      <a class="btn btn-facebook" href="https://www.facebook.com/profile.php?id=100064143365816" target="_blank">
        <span class="icon-circle">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="#ffffff"><path d="M19 6h3V1.7c-.5-.07-2.2-.2-4.2-.2-4.16 0-7 2.54-7 7.2V13H6v5h4.8v13h5.3V18H21l.7-5h-5.6V9.2c0-1.44.4-2.43 2.9-2.43z"/></svg>
        </span>
        <span class="btn-title">Facebook</span>
        <span class="btn-arrow">&#8594;</span>
      </a>

      <a class="btn btn-whatsapp" href="https://wa.me/527122319080" target="_blank">
        <span class="icon-circle">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="#ffffff"><path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.2.6 4.27 1.63 6.05L4 29l8.14-1.6a12.9 12.9 0 0 0 3.88.6h.01C22.6 28 28 22.6 28 15.98 28 9.4 22.6 3 16.02 3zm0 22.9c-1.27 0-2.5-.25-3.65-.72l-.26-.11-4.83.95.98-4.7-.13-.28a10.4 10.4 0 0 1-1.5-5.36c0-5.75 4.68-10.43 10.4-10.43 5.72 0 10.4 4.68 10.4 10.43 0 5.75-4.68 10.22-10.41 10.22zm5.7-7.68c-.31-.16-1.85-.91-2.14-1.02-.29-.1-.5-.16-.71.16-.21.31-.82 1.02-1 1.23-.18.21-.37.23-.68.08-.31-.16-1.32-.49-2.51-1.56-.93-.83-1.56-1.86-1.74-2.17-.18-.31-.02-.48.14-.63.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.1-.21.05-.39-.03-.55-.08-.16-.71-1.71-.97-2.34-.26-.62-.52-.53-.71-.54h-.6c-.21 0-.55.08-.84.39-.29.31-1.1 1.08-1.1 2.63s1.13 3.05 1.29 3.26c.16.21 2.22 3.39 5.38 4.75.75.32 1.34.51 1.8.66.76.24 1.44.21 1.99.13.61-.09 1.85-.76 2.11-1.49.26-.73.26-1.36.18-1.49-.08-.13-.29-.21-.6-.36z"/></svg>
        </span>
        <span class="btn-title">WhatsApp</span>
        <span class="btn-arrow">&#8594;</span>
      </a>

      <a class="btn btn-google" href="https://search.google.com/local/writereview?placeid=ChIJVQZ5CMX70oURISEiY5jII1g" target="_blank">
        <span class="icon-circle white-bg">
          <svg viewBox="0 0 48 48" width="22" height="22"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.5 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C39.9 36.9 44 31 44 24c0-1.3-.1-2.6-.4-3.5z"/></svg>
        </span>
        <span class="btn-title">Rese&ntilde;as</span>
        <span class="btn-arrow">&#8594;</span>
      </a>
    </div>

    <div class="divider d4"><span class="line"></span><span class="heart">&#10084;</span><span class="line"></span></div>

    <p class="tag">&iexcl;Gracias por formar parte de Decorarte!</p>
    <p class="loc">TEMASCALCINGO</p>
  </div>

<script>
  const colors = ['#f5c6d6', '#f8d7e2', '#fbe4ec'];
  for (let i = 0; i < 18; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    const s = 4 + Math.random()*4;
    c.style.width = c.style.height = s + 'px';
    c.style.animationDuration = (2.5 + Math.random()*2) + 's';
    c.style.animationDelay = (2.0 + Math.random()*0.8) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 7000);
  }
</script>
</body>
</html>
